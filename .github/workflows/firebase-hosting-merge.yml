# Deploys the production site when commits land on master.
# Requires the FIREBASE_SERVICE_ACCOUNT_PORTFOLIO_DD896 repository secret.

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  checks: write
  contents: read

jobs:
  build_and_deploy:
    name: Verify, build, and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # preverify rebuilds theme.css, then astro check and prettier --check.
      - run: npm run verify

      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIO_DD896 }}
          channelId: live
          projectId: portfolio-dd896

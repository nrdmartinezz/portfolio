# Pushing to master publishes the live site.
# Requires the FIREBASE_SERVICE_ACCOUNT_PORTFOLIO_DD896 repository secret.

name: Deploy

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-live
  cancel-in-progress: false

permissions:
  checks: write
  contents: read

jobs:
  deploy:
    name: Verify, build, and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # preverify rebuilds theme.css, then astro check and prettier --check.
      - run: npm run verify

      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIO_DD896 }}
          channelId: live
          projectId: portfolio-dd896
